<script>
        const cursor = document.querySelector(`.custom-cursor`);
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        const navbar = document.querySelector('.navbar');
        const categoryTabs = document.querySelectorAll(`.category-tab`);
        const contentSections = document.querySelectorAll(`.content-section`);

        document.addEventListener(`mousemove`, (e) => {
            cursor.style.left = e.clientX + `px`;
            cursor.style.top = e.clientY + `px`;
        });

        document.querySelectorAll(`a, button, .coffee-card, .gift-card, .drip-card`).forEach(el => {
            el.addEventListener(`mouseenter`, () => cursor.classList.add(`hover`));
            el.addEventListener(`mouseleave`, () => cursor.classList.remove(`hover`));
        });

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
        document.querySelectorAll('.nav-links a').forEach(item => {
            item.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                hamburger.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });

        window.addEventListener(`scroll`, () => {
            if (window.scrollY > 50) {
                navbar.classList.add(`scrolled`);
            } else {
                navbar.classList.remove(`scrolled`);
            }
        });

        categoryTabs.forEach(tab => {
            tab.addEventListener(`click`, () => {
                const category = tab.dataset.category;
                
                categoryTabs.forEach(t => t.classList.remove(`active`));
                tab.classList.add(`active`);
                
                contentSections.forEach(section => {
                    section.classList.remove(`active`);
                    if (section.id === category) {
                        section.classList.add(`active`);
                    }
                });
            });
        });
    </script>

/* === TT Mobile Nav JS === */
(function() {
    function init() {
        var toggle = document.querySelector('.hamburger') || document.querySelector('.mobile-menu');
        var links = document.querySelector('nav .nav-links');
        if (!toggle || !links) return;
        // ?踹???蝬?
        if (toggle.dataset.ttBound === '1') return;
        toggle.dataset.ttBound = '1';
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            toggle.classList.toggle('active');
            links.classList.toggle('active');
            links.classList.toggle('mobile-active');
        });
        links.querySelectorAll('a').forEach(function(a) {
            a.addEventListener('click', function() {
                toggle.classList.remove('active');
                links.classList.remove('active');
                links.classList.remove('mobile-active');
            });
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

<script>
(function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.drip-mix-item'));
    var countEl = document.getElementById('dripTotalCount');
    var flavorEl = document.getElementById('dripFlavorCount');
    var priceEl = document.getElementById('dripTotalPrice');
    var resetButton = document.getElementById('dripReset');
    if (!items.length || !countEl || !flavorEl || !priceEl) return;

    function updateDripTotal() {
        var totalCount = 0;
        var flavorCount = 0;
        var totalPrice = 0;
        items.forEach(function (item) {
            var input = item.querySelector('.qty-input');
            var quantity = Math.max(0, parseInt(input.value, 10) || 0);
            input.value = quantity;
            totalCount += quantity;
            totalPrice += quantity * Number(item.dataset.price || 0);
            if (quantity > 0) flavorCount += 1;
        });
        countEl.textContent = totalCount;
        flavorEl.textContent = flavorCount;
        priceEl.textContent = totalPrice.toLocaleString('zh-TW');
    }

    items.forEach(function (item) {
        var input = item.querySelector('.qty-input');
        item.querySelector('.qty-minus').addEventListener('click', function () {
            input.value = Math.max(0, (parseInt(input.value, 10) || 0) - 1);
            updateDripTotal();
        });
        item.querySelector('.qty-plus').addEventListener('click', function () {
            input.value = (parseInt(input.value, 10) || 0) + 1;
            updateDripTotal();
        });
        input.addEventListener('input', updateDripTotal);
    });

    resetButton.addEventListener('click', function () {
        items.forEach(function (item) { item.querySelector('.qty-input').value = 0; });
        updateDripTotal();
    });
    updateDripTotal();
})();
</script>

})();
